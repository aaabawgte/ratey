<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ratey" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <script>
      // Tema se postavlja prije prvog iscrtavanja da nema bljeska.
      (function () {
        try {
          var saved = localStorage.getItem("ratey_theme");
          var dark = saved
            ? saved === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark)
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0e0e0d");
        } catch (e) {}
      })();
    </script>
    <title>Ratey — naša mjesta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
